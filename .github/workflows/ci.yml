name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  baseline:
    uses: e0da/actions/.github/workflows/ci-baseline.yml@main
    secrets: inherit

  rust:
    uses: e0da/actions/.github/workflows/ci-rust.yml@main
    needs: baseline
    secrets: inherit
